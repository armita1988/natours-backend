name: Trailora Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trailora-backend-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend workflow
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Confirm workflow execution
        run: echo "Trailora backend workflow is running successfully."
