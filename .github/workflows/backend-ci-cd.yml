name: Trailora Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: trailora-backend-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend workflow
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: print current working directory
        run: pwd

      - name: print current files in the working directory
        run: ls -la

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: run ESLint
        run: npm run lint

      - name: Confirm workflow execution
        run: echo "Trailora backend workflow is running successfully."
