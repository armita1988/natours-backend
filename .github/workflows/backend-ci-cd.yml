name: Trailora Backend CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      image_tag:
        description: Docker image tag or commit SHA to deploy
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: trailora-backend-production
  cancel-in-progress: true

jobs:
  verify:
    name: Verify backend workflow
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Print current working directory
        run: pwd

      - name: Print current files in the working directory
        run: ls -la

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Confirm workflow execution
        run: echo "Trailora backend workflow is running successfully."
  build:
    name: Build and push Docker image
    runs-on: ubuntu-22.04
    needs: verify

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          file: Dockerfile.prod
          context: .
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/trailora-backend:latest
            ${{ vars.DOCKERHUB_USERNAME }}/trailora-backend:${{ github.sha }}

  deploy:
    name: Deploy backend to EC2 server
    runs-on: ubuntu-22.04
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Copy Docker Compose file to EC2
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          source: compose.prod.yaml
          target: ${{ vars.EC2_APP_DIR }}

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          IMAGE_TAG: ${{ inputs.image_tag || github.sha }}
        with:
          host: ${{ vars.EC2_HOST }}
          username: ${{ vars.EC2_USER }}
          key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
          envs: IMAGE_TAG
          script: |
            set -e
            echo "Deploying backend image with tag: ${IMAGE_TAG}"
            cd "${{ vars.EC2_APP_DIR }}"
            trap 'echo "Error occurred while deploying backend image"; docker compose -f compose.prod.yaml logs --tail 100 api || true' ERR
            echo "Docker Compose will pull this image:"
            docker compose -f compose.prod.yaml config --images
            docker compose -f compose.prod.yaml pull api
            docker compose -f compose.prod.yaml up \
              -d \
              --no-build \
              --force-recreate \
              --wait \
              --wait-timeout 90 \
              api
            docker compose -f compose.prod.yaml ps
            echo "Deployment to EC2 completed successfully."
